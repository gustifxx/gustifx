<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="gustifx.art has moved to gustiadrian.com">
    
    <meta http-equiv="refresh" content="10;url=https://gustiadrian.com/">
    <title>We Have Moved | Gusti Adrianta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-transition"></div>
    <div class="noise-overlay"></div>

    <main>
        <section class="error-section">
            <div class="glass-panel error-card reveal active">
                <div style="font-size: 3rem; color: var(--accent-blue-bright); margin-bottom: 1rem;">
                    <i class="fa-solid fa-rocket"></i>
                </div>
                
                <p class="mono-subtitle error-code">WEBSITE RELOCATION</p>
                
                <h1 class="error-title">
                    We've moved to a <br><em>New Home</em>.
                </h1>
                
                <p class="error-desc" style="max-width: 480px;">
                    <strong>gustifx.art</strong> is now <strong>gustiadrian.com</strong>. <br>
                    Please update your bookmarks. You will be redirected to the new website automatically in a few seconds.
                </p>

                <div class="error-actions" style="margin-top: 1rem;">
                    <a href="https://gustiadrian.com/" class="submit-btn glow-effect" style="display: inline-flex; align-items: center; gap: 0.8rem;">
                        Go to gustiadrian.com <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.body.classList.add("page-loaded");
            }, 100);
        });

        setTimeout(() => {
            document.body.classList.remove("page-loaded");
            document.body.classList.add("page-exit");
        }, 9500);
    </script>
</body>
</html>
